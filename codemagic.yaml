workflows:
  ios-release:
    name: iOS App Store Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager (Use CocoaPods for Agora/Firebase)
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages and generate iOS configs
        script: |
          flutter packages pub get
          flutter build ios --config-only --release
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Fetch or create signing files from Apple
        script: |
          app-store-connect fetch-signing-files "az.idrak.liseyi" --type IOS_APP_STORE --create
          xcode-project use-profiles
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
